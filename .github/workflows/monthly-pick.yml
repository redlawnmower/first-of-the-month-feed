name: Monthly video pick

on:
  schedule:
    # 26th of every month, 17:00 UTC. Gives a few days of buffer before the 1st.
    - cron: "0 17 26 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick this month's video
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/pick-video.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet videos.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "first-of-the-month-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Monthly video pick: $(date -u +%Y-%m-%d)"
          git push
