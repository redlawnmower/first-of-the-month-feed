name: Monthly video pick

on:
  schedule:
    # The 1st of every month, every 2 hours from 09:00 to 19:00 UTC
    # (4 AM–2 PM Eastern / 1 AM–11 AM Pacific). Each run re-ranks by fresh view counts.
    - cron: "0 9,11,13,15,17,19 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today isn't the 1st (for testing; ignores the today-only filter)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monthly-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick the video
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/pick-video.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet videos.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "first-of-the-month-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Video pick: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
